<div class="min-h-screen" style="background-color: #E0EEE9;">

  <nav
    class="shadow-md px-8 py-4 flex justify-between items-center"
    style="background-color: #363C46;"
  >
    <h1 class="text-xl font-bold text-white">
      RealEstate Admin
    </h1>

    <div class="flex items-center gap-6">

      <a
        *ngIf="isSuperAdmin"
        routerLink="/admins"
        class="text-sm font-medium hover:opacity-80"
        style="color: #CFB6A8;"
      >
        Admins
      </a>

      <a
        routerLink="/complexes"
        class="text-sm font-medium hover:opacity-80"
        style="color: #CFB6A8;"
      >
        Complexes
      </a>

      <a
        routerLink="/buildings"
        class="text-sm font-medium hover:opacity-80"
        style="color: #CFB6A8;"
      >
        Buildings
      </a>

      <button
        (click)="logout()"
        class="text-sm font-medium text-white hover:opacity-80"
      >
        Logout
      </button>

    </div>
  </nav>

  <div class="p-10">
    <div class="bg-white rounded-2xl shadow p-8 max-w-2xl mx-auto text-center">

      <h2
        class="text-2xl font-bold mb-2"
        style="color: #363C46;"
      >
        Welcome, {{ name }}!
      </h2>

      <p
        class="text-sm"
        style="color: #5D6472;"
      >
        Role: {{ role | titlecase }}
      </p>

      <div class="mt-8 grid grid-cols-3 gap-4">

        <a
          *ngIf="isSuperAdmin"
          routerLink="/admins"
          class="p-6 rounded-xl text-white font-semibold hover:opacity-90 transition"
          style="background-color: #363C46;"
        >
          Admins
        </a>

        <a
          routerLink="/complexes"
          class="p-6 rounded-xl text-white font-semibold hover:opacity-90 transition"
          style="background-color: #5D6472;"
        >
          Complexes
        </a>

        <a
          routerLink="/buildings"
          class="p-6 rounded-xl text-white font-semibold hover:opacity-90 transition"
          style="background-color: #CFB6A8;"
        >
          Buildings
        </a>

      </div>

    </div>
  </div>

</div>
